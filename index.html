<!DOCTYPE html>
<html>
<head>
<style>

body{
    background-color: orange;
    text-align: center;
    font-family: Arial;
}

/* ALL MENUS */
.menu{
    width: 400px;
    height: 550px;
    border: 4px solid black;
    margin: 20px auto;
    padding: 20px;
    color: white;
    background-size: cover;
    background-repeat: no-repeat;
}

/* BREAKFAST */
.breakfast{
    background-image: url("IMG_1744.jpeg");
}

/* LUNCH */
.lunch{
    background-image: url("lunch.jpg");
}

/* DINNER */
.dinner{
    background-image: url("dinner.jpg");
}

</style>
</head>

<body>

<div class="menu breakfast">
    <h1>Breakfast</h1>

    <h3>Food</h3>
    <p>Eggs</p>
    <p>Bacon</p>
    <p>Toast</p>

    <h3>Drinks</h3>
    <p>Orange Juice</p>
    <p>Milk</p>
</div>

<div class="menu lunch">
    <h1>Lunch</h1>

    <h3>Food</h3>
    <p>Sandwich</p>
    <p>Strawberries</p>
    <p>Carrots</p>

    <h3>Drinks</h3>
    <p>Lemonade</p>
    <p>Water</p>
</div>

<div class="menu dinner">
    <h1>Dinner</h1>

    <h3>Food</h3>
    <p>Pasta</p>
    <p>Broccoli</p>
    <p>Chicken</p>

    <h3>Dessert</h3>
    <p>Ice Cream</p>
</div>

</body>
</html>
